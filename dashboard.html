<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Device Monitor</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>📹 Device Monitor</h2>
            </div>
            <ul class="sidebar-menu">
                <li class="active"><a href="/dashboard.html">📊 Dashboard</a></li>
                <li><a href="/devices.html">📱 Devices</a></li>
                <li><a href="/camera.html">📷 Live Camera</a></li>
                <li><a href="/settings.html">⚙️ Settings</a></li>
                <li><a href="#" id="logoutBtn">🚪 Logout</a></li>
            </ul>
        </nav>
        
        <main class="main-content">
            <header class="top-header">
                <h1>Dashboard</h1>
                <div class="user-info">
                    <span id="userEmail"></span>
                    <span class="status-dot online"></span>
                </div>
            </header>
            
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📱</div>
                    <div class="stat-info">
                        <h3 id="totalDevices">0</h3>
                        <p>Total Devices</p>
                    </div>
                </div>
                <div class="stat-card online">
                    <div class="stat-icon">🟢</div>
                    <div class="stat-info">
                        <h3 id="onlineDevices">0</h3>
                        <p>Online</p>
                    </div>
                </div>
                <div class="stat-card offline">
                    <div class="stat-icon">🔴</div>
                    <div class="stat-info">
                        <h3 id="offlineDevices">0</h3>
                        <p>Offline</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-info">
                        <h3 id="activeClients">0</h3>
                        <p>Active Clients</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🚫</div>
                    <div class="stat-info">
                        <h3 id="revokedClients">0</h3>
                        <p>Revoked</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📷</div>
                    <div class="stat-info">
                        <h3 id="camerasAvailable">0</h3>
                        <p>Cameras Available</p>
                    </div>
                </div>
            </section>
            
            <section class="recent-activity">
                <h2>Recent Activity</h2>
                <div id="activityLog" class="activity-log">
                    <div class="loading">Loading activities...</div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <script type="module">
        import { initializeAuth } from './services/auth.js';
        import { api } from './services/api.js';
        import { socketService } from './services/socket.js';
        
        document.addEventListener('DOMContentLoaded', async () => {
            const auth = initializeAuth();
            
            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    window.location.href = '/login.html';
                    return;
                }
                document.getElementById('userEmail').textContent = user.email;
                await loadDashboardData();
                
                const token = await user.getIdToken();
                socketService.initialize(token);
                setupSocketListeners();
            });
            
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await auth.signOut();
                socketService.disconnect();
                window.location.href = '/login.html';
            });
        });
        
        async function loadDashboardData() {
            try {
                const [devices, clients, activities] = await Promise.all([
                    api.get('/devices'),
                    api.get('/clients'),
                    api.get('/activities?limit=10')
                ]);
                
                const total = devices.length;
                const online = devices.filter(d => d.status === 'online').length;
                const offline = devices.filter(d => d.status === 'offline').length;
                const activeClients = clients.filter(c => c.status === 'active').length;
                const revokedClients = clients.filter(c => c.status === 'revoked').length;
                const camerasAvailable = devices.filter(d => d.hasCamera).length;
                
                document.getElementById('totalDevices').textContent = total;
                document.getElementById('onlineDevices').textContent = online;
                document.getElementById('offlineDevices').textContent = offline;
                document.getElementById('activeClients').textContent = activeClients;
                document.getElementById('revokedClients').textContent = revokedClients;
                document.getElementById('camerasAvailable').textContent = camerasAvailable;
                
                const container = document.getElementById('activityLog');
                if (!activities || activities.length === 0) {
                    container.innerHTML = '<div class="empty-state">No recent activities</div>';
                    return;
                }
                
                container.innerHTML = activities.map(activity => `
                    <div class="activity-item">
                        <span class="activity-time">${new Date(activity.timestamp).toLocaleString('id-ID')}</span>
                        <span class="activity-type ${activity.type}">${activity.type}</span>
                        <span class="activity-desc">${activity.description}</span>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('activityLog').innerHTML = 
                    '<div class="error">Failed to load data</div>';
            }
        }
        
        function setupSocketListeners() {
            socketService.on('device:status', () => loadDashboardData());
            socketService.on('client:connect', () => loadDashboardData());
            socketService.on('client:disconnect', () => loadDashboardData());
            socketService.on('device:revoked', () => loadDashboardData());
            socketService.on('device:deleted', () => loadDashboardData());
        }
    </script>
</body>
</html>
